services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: ${TRACEY_POSTGRES_DB:-tracey}
      POSTGRES_USER: ${TRACEY_POSTGRES_USER:-tracey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${TRACEY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - tracey-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRACEY_POSTGRES_USER:-tracey} -d ${TRACEY_POSTGRES_DB:-tracey}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  tracey-postgres:
