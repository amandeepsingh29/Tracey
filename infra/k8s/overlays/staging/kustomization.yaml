apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tracey-staging
resources:
  - ../../base
labels:
  - pairs:
      tracey.ai/deployment-profile: staging
images:
  - name: tracey-api
    newName: registry.example.com/tracey/api
    newTag: 0.1.0-rc.1
  - name: tracey-executor
    newName: registry.example.com/tracey/executor
    newTag: 0.1.0-rc.1
  - name: tracey-worker
    newName: registry.example.com/tracey/worker
    newTag: 0.1.0-rc.1
  - name: tracey-ui
    newName: registry.example.com/tracey/ui
    newTag: 0.1.0-rc.1
