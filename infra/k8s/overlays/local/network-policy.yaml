apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracey-postgres-ingress
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: tracey-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [tracey-api, tracey-executor, tracey-worker]
      ports:
        - { protocol: TCP, port: 5432 }
