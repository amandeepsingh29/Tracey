receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:14317
      http:
        endpoint: 127.0.0.1:14318

processors:
  resource/redact:
    attributes:
      - key: host.name
        action: delete
  attributes/redact:
    actions:
      - key: prompt
        action: delete
      - key: output
        action: delete
      - key: arguments
        action: delete
      - key: result
        action: delete
      - key: command
        action: delete
      - key: user.email
        action: delete
      - key: user.account_id
        action: delete
      - key: user.account_uuid
        action: delete
      - key: organization.id
        action: delete
      - key: workspace.host_paths
        action: delete
      - key: full_command
        action: delete
      - key: tool_input
        action: delete
      - key: tool_parameters
        action: delete
      - key: file_path
        action: delete
      - key: request.body
        action: delete
      - key: response.body
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete
      - key: gen_ai.tool.call.arguments
        action: delete
      - key: gen_ai.tool.call.result
        action: delete
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: detailed
  file:
    path: /tmp/tracey-codex-contract.json
    rotation:
      max_megabytes: 10
      max_backups: 1

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource/redact, attributes/redact, batch]
      exporters: [debug, file]
    logs:
      receivers: [otlp]
      processors: [resource/redact, attributes/redact, batch]
      exporters: [debug, file]
