name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: >-
          pnpm install --frozen-lockfile
          --fetch-retries=5
          --fetch-timeout=300000
          --network-concurrency=16

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify runtime isolation
        run: pnpm test:runtime

      - name: Load-test Runs pagination
        run: pnpm verify:runs-load

      - name: Verify production manifests
        run: pnpm verify:production
